<aside class="sidebar" [class.collapsed]="isCollapsed">

    <!-- Top: Logo + Toggle -->
    <div class="sidebar-header">
        @if (!isCollapsed) {
        <span class="sidebar-logo">
            <i class="fas fa-shield-alt"></i> Admin
        </span>
        }
        <button class="toggle-btn" (click)="toggle()" aria-label="Toggle sidebar">
            <i [class]="isCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left'"></i>
        </button>
    </div>

    <!-- Nav Links -->
    <nav class="sidebar-nav">
        @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [title]="isCollapsed ? item.label : ''">
            <i [class]="item.icon"></i>
            @if (!isCollapsed) {
            <span>{{ item.label }}</span>
            }
        </a>
        }
    </nav>

    <!-- Bottom: Logout -->
    <div class="sidebar-footer">
        <button class="nav-item logout-btn" (click)="logout()" [title]="isCollapsed ? 'Logout' : ''">
            <i class="fas fa-sign-out-alt"></i>
            @if (!isCollapsed) {
            <span>Logout</span>
            }
        </button>
    </div>

</aside>
