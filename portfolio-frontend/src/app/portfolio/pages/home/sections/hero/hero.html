<section class="hero">
  <div class="hero-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="hero-container">
    @if (profile) {
      <div class="hero-content">

        <div class="hero-text">
          <span class="eyebrow">{{ profile.heroEyebrow }}</span>
          <h1 class="hero-name">{{ profile.fullName }}</h1>
          <p class="hero-subtitle">{{ profile.heroSubtitle }}</p>

          <div class="hero-actions">
            <button class="btn-primary" (click)="scrollTo('#contact')">
              Get In Touch
            </button>
            <button class="btn-secondary" (click)="scrollTo('#projects')">
              View Projects
            </button>
            @if (profile.resumeDownloadUrl) {
              <a class="btn-ghost" [href]="profile.resumeDownloadUrl" target="_blank">
                <i class="fas fa-download"></i> Resume
              </a>
            }
          </div>

          <div class="social-links">
            @if (profile.linkedinUrl) {
              <a [href]="profile.linkedinUrl" target="_blank" class="social-link" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
              </a>
            }
            @if (profile.githubUrl) {
              <a [href]="profile.githubUrl" target="_blank" class="social-link" aria-label="GitHub">
                <i class="fab fa-github"></i>
              </a>
            }
            @if (profile.email) {
              <a [href]="'mailto:' + profile.email" class="social-link" aria-label="Email">
                <i class="fas fa-envelope"></i>
              </a>
            }
          </div>
        </div>

        <div class="hero-avatar">
          @if (profile.profilePicture) {
            <div class="avatar-ring">
              <img [src]="BASE + profile.profilePicture" [alt]="profile.fullName" />
            </div>
          }
        </div>

      </div>
    }

    <div class="scroll-hint" (click)="scrollTo('#about')">
      <i class="fas fa-chevron-down"></i>
    </div>
  </div>
</section>
